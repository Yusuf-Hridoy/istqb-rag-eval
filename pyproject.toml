[project]
name = "istqb-rag"
version = "0.1.0"
description = "A RAG assistant that answers only from the ISTQB CTFL v4.0 syllabus, built to be evaluated with Ragas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-chroma",
    "langchain-community<0.4",
    "langchain-groq",
    "langchain-text-splitters",
    "pymupdf",
    "fastembed",
    "streamlit",
    "python-dotenv",
    "ragas>=0.4.3",
    "langchain-google-genai>=4.4.0",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/istqb_rag"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
